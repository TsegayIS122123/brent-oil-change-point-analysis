name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]  # Use 3.11 for compatibility
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        pytest tests/ -v
    
    - name: Check notebook structure
      run: |
        # Check if notebooks directory exists and has files
        if [ -d "notebooks" ]; then
          echo "✓ Notebooks directory exists"
          ls -la notebooks/
        else
          echo "⚠ Notebooks directory missing - creating empty"
          mkdir -p notebooks
          touch notebooks/.gitkeep
        fi
